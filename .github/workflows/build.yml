name: Build Pipeline

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      #Build & Test
      - name: Build with Maven
        run: mvn clean package spring-boot:repackage
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rest-service-jar
          path: target/rest-service-eb.jar
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rest-service-sbom
          path: target/classes/META-INF/sbom/application.cdx.json

  analyze:
    name: CodeQL Analysis
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java Eclipse Temurin 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Set up Python latest
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java, python

    - name: Perform Maven Build
      run: mvn clean package spring-boot:repackage

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  docker-smoke:
    name: Docker Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rest-service-jar
          path: target
      - name: Build local smoke image
        run: docker build -t rest-service-smoke:test .
      - name: Run container smoke test
        run: |
          set -euo pipefail
          EXT_DIR="$(mktemp -d)"
          mkdir -p "$EXT_DIR/conf" "$EXT_DIR/tls" "$EXT_DIR/logs"
          chmod 777 "$EXT_DIR/logs"
          cp src/main/resources/application.yml "$EXT_DIR/conf/vss.yml"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$EXT_DIR/tls/key.pem" \
            -out "$EXT_DIR/tls/cert.pem" \
            -subj "/CN=localhost"
          chmod 644 "$EXT_DIR/tls/cert.pem" "$EXT_DIR/tls/key.pem"

          docker run -d --name vss-smoke --network host \
            -v "$EXT_DIR:/opt/vss/ext" \
            rest-service-smoke:test

          cleanup() {
            docker rm -f vss-smoke >/dev/null 2>&1 || true
            rm -rf "$EXT_DIR"
          }
          trap cleanup EXIT

          for i in $(seq 1 45); do
            if curl -kfsS https://localhost:8443/actuator/health/readiness | grep -q '"status":"UP"'; then
              curl -kfsS https://localhost:8443/vss/v2/policies | grep -q 'validationPolicies'
              echo "Container smoke test passed on attempt $i"
              exit 0
            fi
            sleep 2
          done

          echo "Container failed readiness check; logs:"
          docker logs vss-smoke || true
          exit 1

  docker:
    name: Build and Push GHCR
    needs: [build, analyze, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rest-service-jar
          path: target
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            PIPELINE_ID=${{ github.sha }}
