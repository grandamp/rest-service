name: Build Pipeline

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      #Build & Test
      - name: Build with Maven
        run: mvn clean package spring-boot:repackage
      - name: Test observability service
        run: python3 -m unittest discover -s observability -p "test_*.py" -v
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rest-service-jar
          path: target/rest-service-eb.jar
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rest-service-sbom
          path: target/classes/META-INF/sbom/application.cdx.json

  analyze:
    name: CodeQL Analysis
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java Eclipse Temurin 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Set up Python latest
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java, python

    - name: Perform Maven Build
      run: mvn clean package spring-boot:repackage

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  docker-smoke:
    name: Docker Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rest-service-jar
          path: target
      - name: Build local smoke image
        run: docker build -t rest-service-smoke:test .
      - name: Build observability smoke image
        run: docker build -t vss-observability-smoke:test -f observability/Dockerfile observability
      - name: Run container smoke test
        run: |
          set -euo pipefail
          EXT_DIR="$(mktemp -d)"
          mkdir -p "$EXT_DIR/conf" "$EXT_DIR/tls" "$EXT_DIR/logs"
          chmod 755 "$EXT_DIR" "$EXT_DIR/conf" "$EXT_DIR/tls"
          chmod 777 "$EXT_DIR/logs"
          cp src/main/resources/application.yml "$EXT_DIR/conf/vss.yml"
          sed -i '/^  intermediates:/,/^  systemlog:/ s/revocation-enabled: true/revocation-enabled: false/' "$EXT_DIR/conf/vss.yml"
          chmod 644 "$EXT_DIR/conf/vss.yml"
          openssl req -x509 -newkey rsa:3072 -sha384 -nodes -days 1 \
            -keyout "$EXT_DIR/tls/key.pem" \
            -out "$EXT_DIR/tls/cert.pem" \
            -subj "/CN=localhost"
          chmod 644 "$EXT_DIR/tls/cert.pem" "$EXT_DIR/tls/key.pem"

          docker run -d --name vss-smoke --network host \
            -v "$EXT_DIR:/opt/vss/ext" \
            rest-service-smoke:test

          docker run -d --name vss-obs-smoke --network host \
            -e PORT=8099 \
            -e VSS_BASE_URL=https://localhost:8443 \
            -e VSS_TLS_VERIFY=false \
            vss-observability-smoke:test

          cleanup() {
            docker rm -f vss-obs-smoke vss-smoke >/dev/null 2>&1 || true
            rm -rf "$EXT_DIR"
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 60); do
            if curl -kfsS https://localhost:8443/actuator/health/readiness | grep -q '"status":"UP"'; then
              READY=1
              echo "vss-smoke ready on attempt $i"
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Container failed readiness check; logs:"
            docker logs vss-smoke || true
            docker logs vss-obs-smoke || true
            exit 1
          fi

          if ! (
            curl -kfsS https://localhost:8443/vss/v2/policies | grep -q 'validationPolicies' &&
            curl -fsS http://127.0.0.1:8099/healthz | python3 -c "import sys,json; assert json.load(sys.stdin)['status']=='UP'" &&
            curl -fsS http://127.0.0.1:8099/api/status | tee /tmp/obs-status.json &&
            python3 -c "import json; d=json.load(open('/tmp/obs-status.json')); assert d['readiness']=='UP' and d['liveness']=='UP', d" &&
            curl -fsS http://127.0.0.1:8099/api/graph | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['telemetrySource']=='actuator/vssgraph' and d['nodeCount']>0, d"
          ); then
            echo "Smoke assertion failed; logs:"
            docker logs vss-smoke || true
            docker logs vss-obs-smoke || true
            exit 1
          fi
          echo "Both rest-service and observability smoke checks passed!"

  docker:
    name: Build and Push GHCR
    needs: [build, analyze, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rest-service-jar
          path: target
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            PIPELINE_ID=${{ github.sha }}
      - name: Extract metadata for Observability Docker
        id: obs_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/observability
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Observability Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./observability
          file: ./observability/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.obs_meta.outputs.tags }}
          labels: ${{ steps.obs_meta.outputs.labels }}
