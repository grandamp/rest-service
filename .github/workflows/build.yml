name: Build Pipeline

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      #Build & Test
      - name: Build with Maven
        run: mvn clean package spring-boot:repackage
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rest-service-jar
          path: target/rest-service-eb.jar
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rest-service-sbom
          path: target/classes/META-INF/sbom/application.cdx.json

  analyze:
    name: CodeQL Analysis
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java Eclipse Temurin 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Set up Python latest
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java, python

    - name: Perform Maven Build
      run: mvn clean package spring-boot:repackage

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  docker:
    name: Build and Push GHCR
    needs: [build, analyze]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rest-service-jar
          path: target
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            PIPELINE_ID=${{ github.sha }}
